<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover a new music genre, playlist, and cultural story every day.">

    <title>Orfeu — Genre of the Day</title>

    <link rel="icon" href="./assets/favicon/favicon-32x32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png" sizes="180x180">
    <link rel="icon" href="./assets/favicon/android-chrome-192x192.png" sizes="192x192">
    <link rel="icon" href="./assets/favicon/android-chrome-512x512.png" sizes="512x512">
    <link rel="stylesheet" href="styles.css">

    <script src="script.js?v=2" defer></script>
</head>
<body>
    <main class="container">
        <div id="title" class="title">Genre of the Day</div>
        <div id="genre" class="genre">Loading genre...</div>

        <a
            id="spotify-link"
            class="spotify-button"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            Open Spotify Playlist
        </a>
        <a
            id="spotify-link-text"
            class="spotify-link-text"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        ></a>

        <section class="description-container" aria-labelledby="description-title">
            <div id="description-title" class="description-title">Genre Description</div>
            <p id="description" class="description-text">Loading description...</p>
        </section>

        <a href="./locations/" class="location-button">Location of the Day</a>
    </main>

</html>
